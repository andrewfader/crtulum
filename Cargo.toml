[package]
name = "crtulum"
version = "0.1.0"
edition = "2021"
description = "A manipulable 3D CRT tube renderer (M1: static test-pattern source)"
license-file = "LICENSE"

[dependencies]
winit = "0.29"
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
env_logger = "0.11"
log = "0.4"

# Offscreen PNG capture for headless verification (`--shot out.png`).
image = { version = "0.24", default-features = false, features = ["png"] }

# M2: live source capture via the ScreenCast portal + PipeWire (the OBS path).
# async-io (not the default tokio) so a plain pollster::block_on drives the portal.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10"
anyhow = "1"
libloading = "0.9.0"
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
gl = "0.14.0"
ash = "0.37"
gilrs = "0.11.2"
cpal = "0.18.1"
serde_json = "1.0.151"
acs = { path = "crates/acs" }

# crtulum patch: vendored wgpu-hal with HDR colorspace mapping for Wayland/mutter
# (maps BT.2020-linear surfaces to Rgba16Float so an HDR swapchain is reachable).
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
libspa-sys = { path = "vendor/libspa-sys" }
pipewire-sys = { path = "vendor/pipewire-sys" }

# Build scripts only -- does not affect codegen of the shipped binary.
# Without debug-assertions (and the overflow-checks Cargo ties to it), bindgen's
# macro evaluator silently drops libspa's casted macros -- SPA_ID_INVALID,
# SPA_IDX_INVALID, SPA_TIME_INVALID, SPA_CPU_FORCE_AUTODETECT -- and libspa then
# fails to compile with E0425. Measured: 0/6 release builds succeed without this,
# 3/3 with it.
[profile.release.build-override]
debug-assertions = true

[profile.dev]
opt-level = 1        # keep the render loop smooth even in debug

[profile.dev.package."*"]
opt-level = 3        # dependencies (wgpu/naga) always optimized
