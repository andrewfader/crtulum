name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      # pipewire-sys probes libpipewire via pkg-config and generates bindings
      # with bindgen (needs libclang); ashpd/winit pull in dbus/wayland at build.
      # Lavapipe executes numerical Vulkan checks on this hosted CPU runner.
      # gilrs needs libudev (gamepad enumeration) and libasound2 (force feedback).
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          ffmpeg \
          clang \
          libclang-dev \
          libpipewire-0.3-dev \
          libdbus-1-dev \
          libwayland-dev \
          libasound2-dev \
          libudev-dev \
          mesa-vulkan-drivers \
          libvulkan1 \
          vulkan-tools
    - name: Select CI software Vulkan driver
      run: |
        icd=$(find /usr/share/vulkan/icd.d /usr/lib -name 'lvp_icd*.json' -print -quit 2>/dev/null)
        test -n "$icd" || { echo "Mesa lavapipe ICD not found"; exit 1; }
        echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
        echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
    - name: Show CI Vulkan device
      run: vulkaninfo --summary
    - name: Build
      run: cargo build --verbose --target-dir target/ci-vulkan
    - name: Confirm normal build rejects software rendering
      run: |
        if target/ci-vulkan/debug/crtulum --shot /tmp/should-not-render.png 80x60 > /tmp/gpu-policy.log 2>&1; then
          echo "Normal build unexpectedly accepted a software adapter"
          exit 1
        fi
        cat /tmp/gpu-policy.log
        grep -q "a physical Vulkan GPU is required" /tmp/gpu-policy.log
    - name: Build headless CI renderer
      run: cargo build --verbose --features ci-software-vulkan --target-dir target/ci-vulkan
    - name: Run tests
      # Run the actual shaders; a missing Vulkan adapter still fails the tests.
      run: cargo test --verbose --features ci-software-vulkan --target-dir target/ci-vulkan
    - name: Native ACS reader tests
      run: cargo test --manifest-path crates/acs/Cargo.toml
    - name: Verify encoded media
      run: python3 scripts/verify_exports.py --binary target/ci-vulkan/debug/crtulum
    - name: Enforce coverage floor
      # Keep the test suite from losing the exercised behavior above. The floor is
      # intentionally below the current baseline so it can only ratchet upward in
      # subsequent changes without turning this first enforcement into a false gate.
      run: |
        rustup component add llvm-tools-preview
        cargo install cargo-llvm-cov --locked
        CARGO_TARGET_DIR=target/ci-vulkan cargo llvm-cov --all --features ci-software-vulkan --no-fail-fast --fail-under-lines 34 -- --test-threads=1
