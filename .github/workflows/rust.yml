name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  CRTULUM_REQUIRE_GPU: "1"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      # pipewire-sys probes libpipewire via pkg-config and generates bindings
      # with bindgen (needs libclang); ashpd/winit pull in dbus/wayland at build.
      # mesa-vulkan-drivers ships lavapipe, a software Vulkan device so the
      # headless GPU test (waterfall_melts) can actually run on the runner.
      # gilrs needs libudev (gamepad enumeration) and libasound2 (force feedback).
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          clang \
          libclang-dev \
          libpipewire-0.3-dev \
          libdbus-1-dev \
          libwayland-dev \
          libasound2-dev \
          libudev-dev \
          mesa-vulkan-drivers \
          libvulkan1 \
          vulkan-tools
    - name: Point Vulkan at lavapipe
      # Pin the loader to lavapipe so the GPU test never depends on a runner GPU
      # being present — but *find* the ICD manifest rather than hardcoding it:
      # the filename is packaging-dependent (mesa 25.2 on noble ships
      # lvp_icd.json, older/other distros lvp_icd.x86_64.json) and a path that
      # does not exist leaves the loader with zero drivers, which looks exactly
      # like "this runner has no GPU".
      run: |
        icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json \
                 /usr/lib/*/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
        if [ -z "$icd" ]; then
          echo "no lavapipe ICD found; mesa-vulkan-drivers ships:"
          find / -name 'lvp_icd*.json' 2>/dev/null
          exit 1
        fi
        echo "using $icd"
        echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
        echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
    - name: Show Vulkan device
      # No `|| true`: if the loader cannot bring up lavapipe, fail here with the
      # loader's own diagnostics rather than six minutes later inside the tests.
      run: vulkaninfo --summary | grep -iE "deviceName|driverName"
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      # CRTULUM_REQUIRE_GPU makes the melt test fail (not skip) if no adapter is
      # found — proving CI genuinely exercised the phosphor-persistence path.
      run: cargo test --verbose

